<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f0"><title>日常待辦｜簡單有序</title>
<style>
:root{--bg:#f5f6f0;--card:#fff;--ink:#26332b;--muted:#748078;--green:#58785f;--line:#e5e9e1;--orange:#b66a37;--red:#b94d4d;--shadow:0 8px 28px #293b2b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto;padding:22px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 22px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--green);font-weight:800}.title{font-size:29px;font-weight:800;letter-spacing:-.04em;margin:3px 0}.subtitle{color:var(--muted);font-size:14px}.round{border:1px solid var(--line);background:white;border-radius:14px;padding:10px 12px;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:15px;box-shadow:var(--shadow)}.panel h2{font-size:16px;margin:0 0 13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fcfdfb;color:var(--ink)}.primary{background:var(--green);color:white;border-radius:13px;padding:13px 16px;font-weight:750}.secondary{background:#edf2eb;color:var(--green);border-radius:11px;padding:9px 11px;font-weight:700}.danger{background:#fff0ee;color:var(--red)}.form-actions{display:flex;gap:8px;margin-top:12px}.form-actions button{flex:1}.tools{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px}.chip{white-space:nowrap;background:#e9ede6;color:#536158;border-radius:99px;padding:9px 13px;font-size:13px}.chip.active{background:var(--green);color:white}.sortrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 12px}.sortrow label{font-size:13px;color:var(--muted)}.sortrow select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;color:var(--ink)}.task{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px}.task.done{opacity:.62}.tick{appearance:none;flex:none;width:22px;height:22px;border:1.7px solid #bdc8bc;border-radius:7px;margin:2px 0 0;display:grid;place-items:center;cursor:pointer}.tick:checked{background:var(--green);border-color:var(--green)}.tick:checked:after{content:"✓";color:white;font-size:15px;font-weight:900}.taskbody{flex:1;min-width:0}.tasktitle{font-weight:750;overflow-wrap:anywhere}.done .tasktitle{text-decoration:line-through}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{font-size:11px;border-radius:7px;background:#eef2ec;color:#536758;padding:4px 7px}.tag.high{background:#fff0e8;color:#ad552d}.tag.urgent{background:#fdeceb;color:#b13f3f}.tag.overdue{background:#fdeceb;color:#b13f3f}.taskactions{display:flex;gap:4px}.iconbtn{background:transparent;color:#7c887f;padding:5px;font-size:17px}.empty{text-align:center;padding:34px 12px;color:var(--muted)}.empty .emoji{font-size:30px}.foot{font-size:12px;color:var(--muted);text-align:center;padding:10px}.notice{display:none;background:#fff4dc;border:1px solid #f0dfb8;border-radius:13px;padding:11px 13px;margin-bottom:12px;font-size:13px}.notice.show{display:block}.small{font-size:12px;color:var(--muted)}.hide{display:none!important}@media(min-width:600px){.wrap{padding-top:32px}.fields{grid-template-columns:1.4fr 1fr 1fr}.field.full{grid-column:1/-1}.stat{padding:17px}.title{font-size:34px}}@media(max-width:370px){.wrap{padding-left:11px;padding-right:11px}.stats{gap:6px}.stat{padding:11px}.stat strong{font-size:21px}.panel{padding:13px}}
</style></head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">YOUR DAY, IN ORDER</div><div class="title">日常待辦</div><div class="subtitle" id="today"></div></div><button class="round" id="notifyBtn">🔔 提醒設定</button></header>
<div class="notice" id="notice"></div>
<section class="stats"><div class="stat"><strong id="remaining">0</strong><span>尚未完成</span></div><div class="stat"><strong id="todayCount">0</strong><span>今天到期</span></div><div class="stat"><strong id="progress">0%</strong><span>完成比例</span></div></section>
<section class="panel"><h2 id="formTitle">＋ 新增待辦事項</h2><form id="taskForm"><input type="hidden" id="editId"><div class="fields">
<div class="field full"><label for="taskName">事項名稱 *</label><input id="taskName" required maxlength="180" placeholder="例如：整理本月請款單"></div>
<div class="field"><label for="category">分類</label><select id="category"><option>工作</option><option>生活</option><option>購物</option></select></div>
<div class="field"><label for="priority">重要程度</label><select id="priority"><option value="2">高優先</option><option value="1" selected>一般</option><option value="0">低優先</option></select></div>
<div class="field"><label for="dueDate">截止日期</label><input id="dueDate" type="date"></div>
<div class="field"><label for="dueTime">截止時間（選填）</label><input id="dueTime" type="time"></div>
<div class="field"><label for="repeat">重複</label><select id="repeat"><option value="none">不重複</option><option value="daily">每天</option><option value="weekly">每週</option></select></div>
<div class="field"><label for="remind">提前提醒</label><select id="remind"><option value="0">到期時</option><option value="5">提前 5 分鐘</option><option value="15">提前 15 分鐘</option><option value="60">提前 1 小時</option><option value="1440">提前 1 天</option></select></div>
</div><div class="form-actions"><button class="primary" type="submit" id="saveBtn">加入清單</button><button class="secondary hide" type="button" id="cancelEdit">取消編輯</button></div></form></section>
<section class="panel"><div class="tools" id="filters"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="open">未完成</button><button class="chip" data-filter="today">今天到期</button><button class="chip" data-filter="done">已完成</button><button class="chip" data-filter="工作">工作</button><button class="chip" data-filter="生活">生活</button><button class="chip" data-filter="購物">購物</button></div>
<div class="sortrow"><strong>待辦清單</strong><label>排序 <select id="sort"><option value="smart">優先程度</option><option value="date">截止時間</option><option value="created">新增順序</option></select></label></div>
<div id="taskList"></div></section>
<section class="panel"><h2>🔄 跨裝置備份與同步</h2><p class="small">這個版本會把資料保存在目前瀏覽器。若要在手機與電腦共用，請在一台裝置匯出備份，再到另一台匯入；真正的即時雲端同步需要額外連接雲端服務。</p><div class="form-actions"><button class="secondary" id="exportBtn">匯出備份</button><button class="secondary" id="importBtn">匯入備份</button><input type="file" id="importFile" accept="application/json,.json" class="hide"></div><p class="small" id="backupStatus"></p></section>
<div class="foot">資料存在這台裝置的瀏覽器中 · 建議定期匯出備份</div>
</main>
<script>
const $=id=>document.getElementById(id), KEY='dailyTodoV2Data';
let tasks=[],filter='all',fired=new Set();
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prioLabel=p=>p==2?'高優先':p==1?'一般':'低優先';
function load(){try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function fmtDue(t){if(!t.dueDate)return '未設定期限';return t.dueDate+(t.dueTime?' · '+t.dueTime:'')}
function overdue(t){return !t.done&&t.dueDate&&(`${t.dueDate}T${t.dueTime||'23:59'}` < new Date().toISOString().slice(0,16))}
function render(){let open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done),today=tasks.filter(t=>!t.done&&t.dueDate===todayISO());$('remaining').textContent=open.length;$('todayCount').textContent=today.length;$('progress').textContent=(tasks.length?Math.round(done.length/tasks.length*100):0)+'%';
let list=tasks.filter(t=>filter==='all'||(filter==='open'&&!t.done)||(filter==='done'&&t.done)||(filter==='today'&&!t.done&&t.dueDate===todayISO())||t.category===filter);
list.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;let s=$('sort').value;if(s==='date')return (a.dueDate||'9999')+(a.dueTime||'23:59') < (b.dueDate||'9999')+(b.dueTime||'23:59')?-1:1;if(s==='created')return (b.created||0)-(a.created||0);return (b.priority-a.priority)||((a.dueDate||'9999').localeCompare(b.dueDate||'9999'))});
$('taskList').innerHTML=list.length?list.map(t=>`<article class="task ${t.done?'done':''}"><input class="tick" type="checkbox" aria-label="完成" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="taskbody"><div class="tasktitle">${esc(t.title)}</div><div class="meta"><span class="tag">${esc(t.category)}</span><span class="tag ${t.priority==2?'high':t.priority==0?'':'urgent'}">${prioLabel(t.priority)}</span>${t.dueDate?`<span class="tag ${overdue(t)?'overdue':''}">${overdue(t)?'已逾期 · ':''}${esc(fmtDue(t))}</span>`:''}${t.repeat!=='none'?`<span class="tag">↻ ${t.repeat==='daily'?'每天':'每週'}</span>`:''}${t.remind>0?`<span class="tag">🔔 提前提醒</span>`:''}</div></div><div class="taskactions"><button class="iconbtn" title="編輯" onclick="editTask('${t.id}')">✎</button><button class="iconbtn" title="刪除" onclick="deleteTask('${t.id}')">×</button></div></article>`).join(''):'<div class="empty"><div class="emoji">🌿</div><strong>目前沒有待辦事項</strong><div class="small">先新增一件事，讓今天更有條理。</div></div>';
document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function toggleTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;if(!t.done&&t.repeat!=='none'){let next={...t,id:crypto.randomUUID?.()||String(Date.now()),done:false,created:Date.now(),dueDate:t.dueDate?shiftDate(t.dueDate,t.repeat==='daily'?1:7):'',notified:false};t.done=true;tasks.push(next)}else t.done=!t.done;save()}
function shiftDate(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function deleteTask(id){if(confirm('確定刪除這項待辦？')){tasks=tasks.filter(t=>t.id!==id);save()}}
function editTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;$('editId').value=t.id;$('taskName').value=t.title;$('category').value=t.category;$('priority').value=t.priority;$('dueDate').value=t.dueDate||'';$('dueTime').value=t.dueTime||'';$('repeat').value=t.repeat;$('remind').value=t.remind;$('formTitle').textContent='✎ 編輯待辦事項';$('saveBtn').textContent='儲存修改';$('cancelEdit').classList.remove('hide');$('taskName').focus();window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){$('taskForm').reset();$('editId').value='';$('priority').value='1';$('formTitle').textContent='＋ 新增待辦事項';$('saveBtn').textContent='加入清單';$('cancelEdit').classList.add('hide')}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();let id=$('editId').value,old=tasks.find(t=>t.id===id);let t={id:id||crypto.randomUUID?.()||String(Date.now()),title:$('taskName').value.trim(),category:$('category').value,priority:Number($('priority').value),dueDate:$('dueDate').value,dueTime:$('dueTime').value,repeat:$('repeat').value,remind:Number($('remind').value),done:old?.done||false,created:old?.created||Date.now(),notified:false};if(!t.title)return;if(old)tasks=tasks.map(x=>x.id===id?t:x);else tasks.push(t);resetForm();save()});
$('cancelEdit').onclick=resetForm;$('sort').onchange=render;
$('filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};
$('notifyBtn').onclick=async()=>{if(!('Notification'in window)){alert('目前瀏覽器不支援系統通知。請保持待辦頁面開啟，頁面仍會顯示到期提醒。');return}let p=await Notification.requestPermission();$('notice').textContent=p==='granted'?'已開啟瀏覽器通知。請保持頁面開啟，才能檢查到期提醒。':'尚未取得通知權限。你仍可在清單中查看截止時間。';$('notice').classList.add('show')};
function checkReminders(){const now=Date.now();for(let t of tasks){if(t.done||!t.dueDate||t.notified)continue;let due=new Date(`${t.dueDate}T${t.dueTime||'09:00'}:00`).getTime(),when=due-t.remind*60000;if(now>=when&&now<=due+60000){t.notified=true;localStorage.setItem(KEY,JSON.stringify(tasks));$('notice').textContent=`⏰ 待辦提醒：${t.title}（${fmtDue(t)}）`;$('notice').classList.add('show');if('Notification'in window&&Notification.permission==='granted')new Notification('待辦事項提醒',{body:`${t.title} · ${fmtDue(t)}`})}}}
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`待辦清單備份-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);$('backupStatus').textContent='備份檔已準備下載。請將同一份檔案匯入另一台裝置。'};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),incoming=Array.isArray(d)?d:d.tasks;if(!Array.isArray(incoming)||incoming.some(t=>!t.title||!t.id))throw Error();if(!confirm(`檔案內有 ${incoming.length} 項待辦。按「確定」會以備份內容取代這台裝置的清單。`))return;tasks=incoming;save();$('backupStatus').textContent='匯入成功。';}catch{$('backupStatus').textContent='匯入失敗：檔案格式不正確。'}e.target.value=''};
$('today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});load();render();checkReminders();setInterval(checkReminders,30000);
</script></body></html>
