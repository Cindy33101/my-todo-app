<head>

<meta name="theme-color" content="#FFFBE8"><title>我的待辦清單｜奶油鵝黃月曆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#75694D;--muted:#9B8E75;--line:#F0EBDD;--bg:#FFFBE8;--card:#fff;--accent:#A88D6C;--accent2:#F5EBC1;--red:#B85C5C;--green:#63866D;--shadow:0 8px 28px #75694d0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:820px;margin:auto;padding:22px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:23px}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.pill{font-size:12px;padding:7px 10px;border-radius:99px;background:#e6f6ef;color:var(--green);white-space:nowrap}.panel,.task,.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.auth{max-width:470px;margin:45px auto;padding:24px}.auth h2{margin:0 0 8px}.muted{color:var(--muted);font-size:14px;line-height:1.55}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:13px;color:#57586c;font-weight:600}.field input,.field select,.addrow input,.addrow select{width:100%;min-width:0;padding:12px 13px;border:1px solid #dedee9;border-radius:11px;background:white;color:var(--ink);outline:none}.field input:focus,.addrow input:focus,.addrow select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #A88D6C1b}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:650}.primary{background:var(--accent);color:white}.secondary{background:var(--accent2);color:var(--accent)}.plain{background:#F5EBC1;color:#75694D}.danger{background:#fff0f2;color:var(--red)}.wide{width:100%}.switchline{display:flex;gap:8px;margin:18px 0}.switchline button{flex:1}.hide{display:none!important}.notice{font-size:13px;margin-top:12px;line-height:1.5}.error{color:var(--red)}.success{color:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:5px}.composer{padding:16px;margin-bottom:16px}.composer h2{font-size:16px;margin:0 0 12px}.addrow{display:grid;grid-template-columns:1fr 125px;gap:9px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;color:var(--ink)}.filters .grow{flex:1;min-width:120px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}.sectionhead h2{font-size:16px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.tasklist{display:grid;gap:9px}.task{padding:14px;display:flex;gap:11px;align-items:flex-start}.check{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--accent)}.taskmain{flex:1;min-width:0}.tasktitle{font-size:15px;font-weight:650;overflow-wrap:anywhere}.done .tasktitle{color:#999;text-decoration:line-through}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{font-size:11px;border-radius:7px;padding:4px 7px;background:#F7F2E5;color:#75694D}.tag.high{background:#fff0f2;color:var(--red)}.tag.due{background:#fff4e6;color:#9a5c0a}.tag.late{background:#ffe3e7;color:#b3243d}.taskactions{display:flex;gap:5px}.iconbtn{border:0;background:#F7F2E5;color:#75694D;border-radius:8px;padding:7px 9px}.empty{text-align:center;padding:30px 12px;color:var(--muted);background:#fff;border:1px dashed #dcdce8;border-radius:16px}.bottom{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}.bottom .btn{font-size:12px}.foot{font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px}.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#21a67a;margin-right:5px}.modal{position:fixed;inset:0;background:#16162a66;display:grid;place-items:center;padding:16px;z-index:5}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(100%,500px);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}..calendar{padding:16px;margin:16px 0}.calendarhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.calendarhead h2{font-size:17px;margin:0}.calendar-nav{display:flex;gap:6px}.calendar-nav button{border:0;border-radius:9px;background:#F5EBC1;color:#75694D;padding:8px 11px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-weekday{text-align:center;color:#A69A83;font-size:12px;padding:5px 0}.calendar-day{min-height:48px;border:1px solid transparent;border-radius:10px;background:#FFFEFA;color:#75694D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 2px}.calendar-day.outside{color:#C9C0AF;background:transparent}.calendar-day.selected{background:#F5EBC1;border-color:#E9DDA8;font-weight:700}.calendar-day.today{box-shadow:inset 0 0 0 1px #B8A17E}.calendar-day .dot{width:5px;height:5px;border-radius:50%;background:#A88D6C}.calendar-day .dot-empty{width:5px;height:5px}.calendar-caption{font-size:12px;color:var(--muted);margin:12px 2px 0}.calendar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.calendar-actions button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 11px}.calendar-actions button.active{background:#F5EBC1;border-color:#E9DDA8}@media(max-width:520px){.wrap{padding:17px 12px 35px}.brand h1{font-size:20px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:20px}.addrow{grid-template-columns:1fr 105px}.details{grid-template-columns:1fr 1fr}.details .field:last-child{grid-column:1/-1}.task{padding:12px}.taskactions{flex-direction:column}.pill{font-size:11px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">✓</div><div><h1>我的待辦清單</h1><p>把每件小事，慢慢完成。</p></div></div><span class="pill" id="syncStatus">● 尚未登入</span></header>
<section id="authPanel" class="panel auth"><h2 id="authTitle">登入待辦清單</h2><p class="muted">登入同一個帳號，就能在 iPhone 和電腦查看相同的待辦事項。</p><div class="field"><label for="email">電子郵件</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label for="password">密碼（至少 6 碼）</label><input id="password" type="password" autocomplete="current-password" placeholder="輸入密碼"></div><div class="switchline"><button id="loginBtn" class="btn primary">登入</button><button id="signupBtn" class="btn secondary">建立帳號</button></div><div id="authMsg" class="notice" role="status"></div><p class="foot">如果註冊後收到確認信，請先到信箱完成驗證，再回來登入。</p></section>
<section id="appPanel" class="hide">
<div class="stats"><div class="stat"><small>全部待辦</small><strong id="totalCount">0</strong></div><div class="stat"><small>尚未完成</small><strong id="openCount">0</strong></div><div class="stat"><small>已完成</small><strong id="doneCount">0</strong></div></div>
<section class="panel composer"><h2>＋ 新增待辦</h2><div class="addrow"><input id="newTitle" maxlength="300" placeholder="例如：繳交報表、買日用品" aria-label="待辦事項"><select id="newCategory" aria-label="分類"><option value="工作">工作</option><option value="生活" selected>生活</option><option value="購物">購物</option></select></div><div class="details"><div class="field"><label for="newPriority">優先順序</label><select id="newPriority"><option value="普通" selected>普通</option><option value="高">高</option><option value="低">低</option></select></div><div class="field"><label for="newDue">到期日期時間</label><input id="newDue" type="datetime-local"></div><div class="field"><label for="newRepeat">重複</label><select id="newRepeat"><option value="不重複">不重複</option><option value="每天">每天</option><option value="每週">每週</option></select></div></div><button id="addBtn" class="btn primary wide">新增待辦</button><div id="appMsg" class="notice" role="status"></div></section>
<div class="filters"><select id="filterCategory" aria-label="分類篩選"><option value="全部">全部分類</option><option>工作</option><option>生活</option><option>購物</option></select><select id="filterStatus" aria-label="狀態篩選"><option value="未完成">未完成</option><option value="全部">全部狀態</option><option value="已完成">已完成</option></select><select id="sortBy" aria-label="排序"><option value="priority">依優先順序</option><option value="due">依到期時間</option><option value="newest">最新建立</option></select><input class="grow" id="searchText" placeholder="搜尋待辦…" aria-label="搜尋"></div>
<section class="panel calendar" aria-label="月份月曆">
  <div class="calendarhead"><h2 id="calendarMonth">月份月曆</h2><div class="calendar-nav"><button type="button" id="prevMonth" aria-label="上個月">‹</button><button type="button" id="todayMonth">今天</button><button type="button" id="nextMonth" aria-label="下個月">›</button></div></div>
  <div class="calendar-grid" id="calendarGrid"></div>
  <p class="calendar-caption" id="calendarCaption">選擇日期查看當天到期的待辦事項；有待辦的日期會顯示小點。</p>
  <div class="calendar-actions"><button type="button" id="showAllDates" class="active">顯示所有日期</button><button type="button" id="clearDate">清除日期選取</button></div>
</section>
<div class="sectionhead"><h2>待辦事項</h2><span id="resultCount">0 項</span></div><div id="taskList" class="tasklist"></div>
<div class="bottom"><button class="btn plain" id="refreshBtn">↻ 重新同步</button><button class="btn plain" id="exportBtn">匯出備份</button><button class="btn plain" id="importBtn">匯入備份</button><input id="importFile" type="file" accept="application/json,.json" class="hide"><button class="btn danger" id="logoutBtn">登出</button></div>
<p class="foot"><span class="syncdot"></span>資料儲存在 Supabase 雲端。請在手機與電腦使用相同帳號。到期提醒目前需開啟待辦頁面才會檢查；iPhone 背景推播尚未設定。</p>
</section></main>
<div id="editModal" class="modal hide"><div class="modalbox"><div class="modalhead"><h3>編輯待辦</h3><button class="iconbtn" id="closeEdit">✕</button></div><input id="editId" type="hidden"><div class="field"><label for="editTitle">事項</label><input id="editTitle" maxlength="300"></div><div class="details"><div class="field"><label for="editCategory">分類</label><select id="editCategory"><option>工作</option><option>生活</option><option>購物</option></select></div><div class="field"><label for="editPriority">優先順序</label><select id="editPriority"><option>高</option><option>普通</option><option>低</option></select></div><div class="field"><label for="editDue">到期日期時間</label><input id="editDue" type="datetime-local"></div><div class="field"><label for="editRepeat">重複</label><select id="editRepeat"><option>不重複</option><option>每天</option><option>每週</option></select></div></div><button id="saveEdit" class="btn primary wide">儲存修改</button><div id="editMsg" class="notice"></div></div></div>
<script>
(() => {
const SUPABASE_URL = 'https://eflsythcnilezrujafls.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_lKEm3nugzPvS5_89GISkcA_iKSOz8wh';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
let user = null, tasks = [], busy = false;\nlet calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);\nlet selectedDate = '';
const priorityRank = {'高':0,'普通':1,'低':2};
function msg(id, text, kind='') { const el=$(id); el.textContent=text; el.className='notice '+kind; }
function setStatus(text, good=false) { $('syncStatus').textContent=(good?'● ':'● ')+text; $('syncStatus').style.background=good?'#e6f6ef':'#f1f1f7'; $('syncStatus').style.color=good?'#168568':'#77788b'; }
function dateToInput(value){ if(!value)return ''; const d=new Date(value); if(Number.isNaN(d.getTime()))return ''; const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function inputToIso(value){ if(!value)return null; const d=new Date(value); return Number.isNaN(d.getTime())?null:d.toISOString(); }
function niceDate(value){if(!value)return '';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function showSession(session){user=session?.user||null;$('authPanel').classList.toggle('hide',!!user);$('appPanel').classList.toggle('hide',!user);if(user){setStatus('已登入，正在同步');await loadTasks();}else{tasks=[];render();setStatus('尚未登入');}}
async function loadTasks(){if(!user)return;setStatus('同步中…');const {data,error}=await db.from('tasks').select('*').order('created_at',{ascending:false});if(error){setStatus('同步失敗');msg('appMsg','讀取雲端失敗：'+error.message,'error');return;}tasks=data||[];setStatus('雲端已同步',true);render();}
async function auth(mode){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('authMsg','請輸入電子郵件和密碼。','error');return;}if(password.length<6){msg('authMsg','密碼至少需要 6 個字元。','error');return;}msg('authMsg',mode==='signup'?'正在建立帳號…':'正在登入…');const result=mode==='signup'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(result.error){msg('authMsg',result.error.message,'error');return;}if(mode==='signup'&&!result.data.session){msg('authMsg','帳號已建立！請查看電子郵件並完成驗證，再回來登入。','success');return;}msg('authMsg','登入成功，正在載入雲端資料…','success');await showSession(result.data.session);}
function localDateKey(value){const d=value instanceof Date?value:new Date(value);if(Number.isNaN(d.getTime()))return '';const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function renderCalendar(){
 const grid=$('calendarGrid');if(!grid)return;
 $('calendarMonth').textContent=`${calendarMonth.getFullYear()} 年 ${calendarMonth.getMonth()+1} 月`;
 const weekdays=['日','一','二','三','四','五','六'];
 let out=weekdays.map(d=>`<div class="calendar-weekday">${d}</div>`).join('');
 const first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1);
 const start=new Date(first);start.setDate(1-first.getDay());
 const todayKey=localDateKey(new Date());
 for(let i=0;i<42;i++){
   const d=new Date(start);d.setDate(start.getDate()+i);
   const key=localDateKey(d),outside=d.getMonth()!==calendarMonth.getMonth();
   const hasTasks=tasks.some(t=>t.due_at&&localDateKey(t.due_at)===key);
   const cls=['calendar-day',outside?'outside':'',selectedDate===key?'selected':'',todayKey===key?'today':''].filter(Boolean).join(' ');
   out+=`<button type="button" class="${cls}" data-calendar-date="${key}" aria-label="${key}${hasTasks?'，有待辦':''}" aria-pressed="${selectedDate===key}"><span>${d.getDate()}</span>${hasTasks?'<span class="dot"></span>':'<span class="dot-empty"></span>'}</button>`;
 }
 grid.innerHTML=out;
 $('calendarCaption').textContent=selectedDate?`目前查看：${selectedDate} 到期的待辦事項。`:'選擇日期查看當天到期的待辦事項；有待辦的日期會顯示小點。';
 $('showAllDates').classList.toggle('active',!selectedDate);
}
function selectCalendarDate(key){selectedDate=key;render();}
function render(){renderCalendar();const total=tasks.length,done=tasks.filter(t=>t.completed).length;$('totalCount').textContent=total;$('openCount').textContent=total-done;$('doneCount').textContent=done;let list=tasks.slice();const cat=$('filterCategory').value,status=$('filterStatus').value,search=$('searchText').value.trim().toLowerCase(),sort=$('sortBy').value;if(cat!=='全部')list=list.filter(t=>t.category===cat);if(status==='未完成')list=list.filter(t=>!t.completed);if(status==='已完成')list=list.filter(t=>t.completed);if(search)list=list.filter(t=>(t.title||'').toLowerCase().includes(search));if(selectedDate)list=list.filter(t=>t.due_at&&localDateKey(t.due_at)===selectedDate);list.sort((a,b)=>{if(sort==='priority')return (priorityRank[a.priority]??1)-(priorityRank[b.priority]??1)||((a.due_at||'').localeCompare(b.due_at||''));if(sort==='due')return (a.due_at||'9999').localeCompare(b.due_at||'9999');return (b.created_at||'').localeCompare(a.created_at||'');});$('resultCount').textContent=`${list.length} 項`;const host=$('taskList');if(!list.length){host.innerHTML='<div class="empty">這裡還沒有符合條件的待辦事項。<br>新增一項，開始整理今天的事情吧！</div>';return;}host.innerHTML=list.map(t=>{const overdue=t.due_at&&!t.completed&&new Date(t.due_at)<new Date();return `<article class="task ${t.completed?'done':''}"><input class="check" type="checkbox" aria-label="標記完成" data-action="toggle" data-id="${t.id}" ${t.completed?'checked':''}><div class="taskmain"><div class="tasktitle">${escapeHtml(t.title)}</div><div class="meta"><span class="tag">${escapeHtml(t.category||'生活')}</span><span class="tag ${(t.priority||'普通')==='高'?'high':''}">${escapeHtml(t.priority||'普通')}優先</span>${t.due_at?`<span class="tag ${overdue?'late':'due'}">${overdue?'已逾期 · ':''}${escapeHtml(niceDate(t.due_at))}</span>`:''}${t.repeat_type&&t.repeat_type!=='不重複'?`<span class="tag">↻ ${escapeHtml(t.repeat_type)}</span>`:''}</div></div><div class="taskactions"><button class="iconbtn" data-action="edit" data-id="${t.id}" aria-label="編輯">✎</button><button class="iconbtn" data-action="delete" data-id="${t.id}" aria-label="刪除">⌫</button></div></article>`;}).join('');}
async function addTask(){const title=$('newTitle').value.trim();if(!title){msg('appMsg','請先輸入待辦事項。','error');$('newTitle').focus();return;}const payload={user_id:user.id,title,category:$('newCategory').value,priority:$('newPriority').value,due_at:inputToIso($('newDue').value),repeat_type:$('newRepeat').value,completed:false};busy=true;$('addBtn').disabled=true;msg('appMsg','正在儲存到雲端…');const {error}=await db.from('tasks').insert(payload);busy=false;$('addBtn').disabled=false;if(error){msg('appMsg','新增失敗：'+error.message,'error');return;}$('newTitle').value='';$('newDue').value='';$('newCategory').value='生活';$('newPriority').value='普通';$('newRepeat').value='不重複';msg('appMsg','已新增並同步到雲端。','success');await loadTasks();}
async function toggleTask(id,checked){const t=tasks.find(x=>x.id===id);if(!t)return;const {error}=await db.from('tasks').update({completed:checked,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('更新失敗：'+error.message);render();return;}if(checked&&t.repeat_type&&t.repeat_type!=='不重複'){const next=new Date(t.due_at||new Date());if(t.repeat_type==='每天')next.setDate(next.getDate()+1);if(t.repeat_type==='每週')next.setDate(next.getDate()+7);const {error:repeatError}=await db.from('tasks').insert({user_id:user.id,title:t.title,category:t.category,priority:t.priority,due_at:t.due_at?next.toISOString():null,repeat_type:t.repeat_type,completed:false});if(repeatError)alert('原事項已完成，但建立下一次重複事項失敗：'+repeatError.message);}await loadTasks();}
function openEdit(id){const t=tasks.find(x=>x.id===id);if(!t)return;$('editId').value=t.id;$('editTitle').value=t.title;$('editCategory').value=t.category||'生活';$('editPriority').value=t.priority||'普通';$('editDue').value=dateToInput(t.due_at);$('editRepeat').value=t.repeat_type||'不重複';msg('editMsg','');$('editModal').classList.remove('hide');}
async function saveEdit(){const id=$('editId').value,title=$('editTitle').value.trim();if(!title){msg('editMsg','事項不能空白。','error');return;}const {error}=await db.from('tasks').update({title,category:$('editCategory').value,priority:$('editPriority').value,due_at:inputToIso($('editDue').value),repeat_type:$('editRepeat').value,updated_at:new Date().toISOString()}).eq('id',id);if(error){msg('editMsg','儲存失敗：'+error.message,'error');return;}$('editModal').classList.add('hide');await loadTasks();}
async function deleteTask(id){const t=tasks.find(x=>x.id===id);if(!t||!confirm(`確定刪除「${t.title}」嗎？`))return;const {error}=await db.from('tasks').delete().eq('id',id);if(error){alert('刪除失敗：'+error.message);return;}await loadTasks();}
function exportData(){const blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='todo-backup.json';a.click();URL.revokeObjectURL(url);}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data))throw Error('檔案格式不正確');const rows=data.filter(t=>t&&typeof t.title==='string'&&t.title.trim()).map(t=>({user_id:user.id,title:t.title,category:['工作','生活','購物'].includes(t.category)?t.category:'生活',priority:['高','普通','低'].includes(t.priority)?t.priority:'普通',due_at:t.due_at||null,completed:!!t.completed,repeat_type:['每天','每週','不重複'].includes(t.repeat_type)?t.repeat_type:'不重複'}));if(!rows.length)throw Error('沒有可匯入的待辦事項');if(!confirm(`將匯入 ${rows.length} 項待辦，是否繼續？`))return;const {error}=await db.from('tasks').insert(rows);if(error)throw error;alert('匯入完成！');await loadTasks();}catch(e){alert('匯入失敗：'+(e.message||'檔案讀取錯誤'));}finally{$('importFile').value='';}}
$('loginBtn').addEventListener('click',()=>auth('login'));$('signupBtn').addEventListener('click',()=>auth('signup'));$('password').addEventListener('keydown',e=>{if(e.key==='Enter')auth('login')});$('addBtn').addEventListener('click',addTask);$('newTitle').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});['filterCategory','filterStatus','sortBy','searchText'].forEach(id=>$(id).addEventListener('input',render));\n$('prevMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendar();});$('nextMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendar();});$('todayMonth').addEventListener('click',()=>{const now=new Date();calendarMonth=new Date(now.getFullYear(),now.getMonth(),1);selectedDate=localDateKey(now);render();});$('showAllDates').addEventListener('click',()=>{selectedDate='';render();});$('clearDate').addEventListener('click',()=>{selectedDate='';render();});$('calendarGrid').addEventListener('click',e=>{const b=e.target.closest('button[data-calendar-date]');if(!b)return;const key=b.dataset.calendarDate;selectedDate=key;const parts=key.split('-').map(Number);calendarMonth=new Date(parts[0],parts[1]-1,1);render();});$('taskList').addEventListener('change',e=>{if(e.target.dataset.action==='toggle')toggleTask(e.target.dataset.id,e.target.checked)});$('taskList').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;if(b.dataset.action==='edit')openEdit(b.dataset.id);if(b.dataset.action==='delete')deleteTask(b.dataset.id)});$('saveEdit').addEventListener('click',saveEdit);$('closeEdit').addEventListener('click',()=>$('editModal').classList.add('hide'));$('refreshBtn').addEventListener('click',loadTasks);$('exportBtn').addEventListener('click',exportData);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>importData(e.target.files[0]));$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();await showSession(null);});
db.auth.onAuthStateChange((_event,session)=>{if(session?.user&&!user){setTimeout(()=>showSession(session),0);}else if(!session&&user){setTimeout(()=>showSession(null),0);}});
(async()=>{const {data}=await db.auth.getSession();await showSession(data.session);})();
})();
</script></body></html>
